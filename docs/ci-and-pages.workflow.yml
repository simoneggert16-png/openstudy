name: CI, Windows Installer & GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Privacy Audit, Typecheck & Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated privacy & secret audit
        env:
          PRIVACY_FORBID_WORDS: ${{ secrets.PRIVACY_FORBID_WORDS }}
        run: npm run privacy-check

      - name: Validate bridge and installer scripts
        run: |
          node --check bridge/server.mjs
          node --check scripts/privacy-audit.mjs
          bash -n installer/macos/Install-OpenStudy.command
          bash -n installer/linux/install-openstudy.sh

      - name: Build OpenStudy web application
        run: npm run build

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstudy-web-dist
          path: dist/
          retention-days: 14

  build-windows-installer:
    name: Build Windows Native Installer (.exe)
    needs: verify-and-build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile OpenStudy-Setup.exe
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build-windows-exe.ps1

      - name: Upload OpenStudy-Setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenStudy-Windows-Installer
          path: installer/windows/OpenStudy-Setup.exe
          retention-days: 90

  deploy-pages:
    name: Assemble & Deploy GitHub Pages
    needs: [verify-and-build, build-windows-installer]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web app
        uses: actions/download-artifact@v4
        with:
          name: openstudy-web-dist
          path: dist

      - name: Download compiled Windows installer
        uses: actions/download-artifact@v4
        with:
          name: OpenStudy-Windows-Installer
          path: installer/windows

      - name: Assemble GitHub Pages bundle
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist

          if [ -f website/index.html ]; then
            cp -R website/. pages-dist/
            mkdir -p pages-dist/app pages-dist/installer/windows pages-dist/installer/macos pages-dist/installer/linux
            cp -R dist/. pages-dist/app/

            if [ -d docs/previews ]; then
              mkdir -p pages-dist/docs/previews
              cp -R docs/previews/. pages-dist/docs/previews/
            fi

            cp installer/windows/OpenStudy-Setup.exe pages-dist/installer/windows/
            cp installer/macos/Install-OpenStudy.command pages-dist/installer/macos/
            cp installer/linux/install-openstudy.sh pages-dist/installer/linux/

            # Rewrite relative parent links for GitHub Pages root deployment
            node -e '
              const fs = require("fs");
              const file = "pages-dist/index.html";
              let html = fs.readFileSync(file, "utf8");
              html = html
                .replace(/\.\.\/dist\/index\.html/g, "./app/index.html")
                .replace(/\.\.\/installer\//g, "./installer/")
                .replace(/\.\.\/docs\//g, "./docs/");
              fs.writeFileSync(file, html, "utf8");
            '
          else
            cp -R dist/. pages-dist/
          fi

          touch pages-dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
